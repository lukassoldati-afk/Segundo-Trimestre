<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard - Animais</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card-container">
    <div class="card">
      <!-- Frente do Card -->
      <div class="card-front">
        <img src="https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?q=80&w=600&auto=format&fit=crop" alt="Foto de um Leão">
        <h2>Leao</h2>
      </div>
      <!-- Verso do Card -->
      <div class="card-back">
        <h2>Leao (Panthera leo)</h2>
        <p>O leao e um mamifero carnivoro da familia dos felineos. Conhecido como o "rei da selva", vive em grupos sociais chamados alcateias e habita principalmente as savanas da África subsahariana.</p>
      </div>
    </div>
  </div>

</body>
</html>
